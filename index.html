<!DOCTYPE html>
<html lang="tr" class="h-full bg-slate-950 overflow-hidden fixed inset-0">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Süzener Market - Resmî Çekiliş Sistemi v13</title>
  <link rel="manifest" href="./manifest.json">

  <!-- PWA & Mobile Web App Meta Tags -->
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Süzener Market">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23f59e0b'/><text x='50' y='68' font-size='55' text-anchor='middle'>🎁</text></svg>">
  
  <link rel="manifest" id="manifestPlaceholder">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      touch-action: manipulation;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
      position: fixed;
      width: 100%;
      height: 100%;
      inset: 0;
    }
    /* Glass Fanus styling */
    .fanus-bowl {
      background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.15), rgba(15, 23, 42, 0.9));
      box-shadow: inset 0 0 35px rgba(255, 255, 255, 0.12), 0 15px 35px rgba(0, 0, 0, 0.8), 0 0 25px rgba(245, 158, 11, 0.25);
      border: 3px solid rgba(255, 255, 255, 0.28);
    }
    /* Ball float animation inside fanus */
    @keyframes floatBall {
      0% { transform: translate(0, 0) rotate(0deg); }
      50% { transform: translate(10px, -12px) rotate(180deg); }
      100% { transform: translate(0, 0) rotate(360deg); }
    }
    .floating-ball {
      animation: floatBall 3.2s infinite ease-in-out;
    }
    /* Ball pop out and zoom animation */
    @keyframes ballPopup {
      0% { transform: scale(0.2) translateY(50px); opacity: 0; }
      60% { transform: scale(1.15) translateY(-8px); opacity: 1; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }
    .animate-ball-pop {
      animation: ballPopup 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    /* Paper unfold animation */
    @keyframes paperUnfold {
      0% { transform: scaleY(0.1) scaleX(0.1); opacity: 0; }
      50% { transform: scaleY(1.08) scaleX(0.5); opacity: 1; }
      100% { transform: scaleY(1) scaleX(1); opacity: 1; }
    }
    .animate-paper-unfold {
      animation: paperUnfold 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col items-center justify-center p-3 overflow-hidden selection:bg-amber-500 selection:text-slate-950">

  <main id="drawContent" class="w-full max-w-md mx-auto flex flex-col items-center justify-center gap-3 my-auto">
    
    <!-- Marka Başlığı -->
    <div class="text-center mb-1">
      <h1 class="text-sm font-black tracking-wider text-amber-400">SÜZENER MARKET</h1>
      <p id="txtConnectionStatus" class="text-[9px] font-semibold text-slate-400">Bulut Bağlı (Hibrit Mod)</p>
    </div>

    <!-- Fanus & Draw Card -->
    <div class="w-full bg-slate-900/90 border-2 border-amber-500/40 rounded-3xl p-4 sm:p-5 shadow-2xl relative flex flex-col items-center justify-center">
      
      <!-- Top Status Info -->
      <div class="w-full flex items-center justify-between mb-2 px-1">
        <span class="text-[10px] font-extrabold uppercase tracking-wider text-amber-400 flex items-center gap-1">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span> AKTİF SİSTEM
        </span>
        <span id="txtRemainingStats" class="text-[10px] font-bold text-slate-300 bg-slate-950 px-2.5 py-0.5 rounded-full border border-slate-800">
          Kalan Hediye: 0
        </span>
      </div>

      <!-- Büyütülmüş Tıklanabilir Cam Fanus Container -->
      <div id="fanusContainer" class="fanus-bowl w-56 h-56 sm:w-64 sm:h-64 rounded-full relative overflow-hidden flex items-center justify-center my-3 cursor-pointer hover:scale-[1.02] active:scale-95 transition-all shadow-2xl group">
        <div class="absolute top-3 left-6 w-16 h-8 bg-white/10 rounded-full blur-md transform -rotate-45 pointer-events-none z-20"></div>

        <div class="absolute inset-2 flex flex-wrap items-center justify-center gap-1.5 p-3 overflow-hidden pointer-events-none opacity-95">
          <div class="w-4 h-4 sm:w-5 sm:h-5 rounded-full bg-amber-500 shadow-lg floating-ball border border-white/40" style="animation-delay: 0s;"></div>
          <div class="w-4 h-4 sm:w-5 sm:h-5 rounded-full bg-rose-500 shadow-lg floating-ball border border-white/40" style="animation-delay: 0.6s;"></div>
          <div class="w-4.5 h-4.5 sm:w-6 sm:h-6 rounded-full bg-emerald-500 shadow-lg floating-ball border border-white/40" style="animation-delay: 1.2s;"></div>
          <div class="w-4 h-4 sm:w-5 sm:h-5 rounded-full bg-sky-500 shadow-lg floating-ball border border-white/40" style="animation-delay: 0.3s;"></div>
          <div class="w-4 h-4 sm:w-5 sm:h-5 rounded-full bg-purple-500 shadow-lg floating-ball border border-white/40" style="animation-delay: 1.5s;"></div>
          <div class="w-4 h-4 sm:w-5 sm:h-5 rounded-full bg-amber-300 shadow-lg floating-ball border border-white/40" style="animation-delay: 0.9s;"></div>
          <div class="w-4 h-4 sm:w-5 sm:h-5 rounded-full bg-indigo-500 shadow-lg floating-ball border border-white/40" style="animation-delay: 1.8s;"></div>
          <div class="w-4 h-4 sm:w-5 sm:h-5 rounded-full bg-teal-400 shadow-lg floating-ball border border-white/40" style="animation-delay: 0.4s;"></div>
          <div class="w-4 h-4 sm:w-5 sm:h-5 rounded-full bg-pink-500 shadow-lg floating-ball border border-white/40" style="animation-delay: 1.1s;"></div>
          <div class="w-4.5 h-4.5 sm:w-6 sm:h-6 rounded-full bg-orange-500 shadow-lg floating-ball border border-white/40" style="animation-delay: 0.7s;"></div>
          <div class="w-4 h-4 sm:w-5 sm:h-5 rounded-full bg-cyan-400 shadow-lg floating-ball border border-white/40" style="animation-delay: 1.6s;"></div>
          <div class="w-4 h-4 sm:w-5 sm:h-5 rounded-full bg-lime-400 shadow-lg floating-ball border border-white/40" style="animation-delay: 0.2s;"></div>
        </div>

        <div class="absolute z-10 text-center bg-slate-950/90 backdrop-blur-md px-4 py-2.5 rounded-2xl border border-amber-500/50 shadow-xl group-hover:border-amber-400 transition-colors">
          <p class="text-xs font-black text-amber-400 tracking-wide">ÇEKMEK İÇİN DOKUN!</p>
          <p class="text-[10px] font-bold text-slate-300">10 TL At & Fanusa Bas</p>
        </div>
      </div>

    </div>

  </main>

  <!-- KAZANÇ / SONUÇ MODALI -->
  <div id="modalResult" class="fixed inset-0 bg-slate-950/85 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
    <div id="animationStage" class="relative flex flex-col items-center justify-center w-full max-w-sm">
      
      <div id="animBall" class="w-28 h-28 sm:w-32 sm:h-32 rounded-full bg-gradient-to-tr from-amber-600 via-amber-400 to-amber-200 border-4 border-white flex items-center justify-center shadow-2xl shadow-amber-500/50 text-slate-950 font-black text-3xl sm:text-4xl animate-ball-pop transition-all mb-4">
        🎯
      </div>

      <div id="animPaper" class="bg-amber-50 text-slate-950 border-4 border-amber-600 rounded-3xl p-6 sm:p-7 w-full text-center shadow-2xl relative animate-paper-unfold hidden">
        <div class="absolute -top-3.5 left-1/2 -translate-x-1/2 bg-amber-600 text-white text-[10px] font-extrabold px-3.5 py-1 rounded-full uppercase tracking-widest shadow">
          RESMÎ ÇEKİLİŞ KARTI
        </div>
        <div class="mt-2 mb-3">
          <p class="text-[10px] font-bold text-amber-800 uppercase tracking-wider">ÇEKİLEN NUMARA</p>
          <h2 id="txtWinnerNumber" class="text-4xl sm:text-5xl font-black text-slate-900 tracking-tight my-1">#000</h2>
        </div>
        <div class="bg-amber-100/90 border border-amber-300 rounded-2xl p-4 my-3">
          <p class="text-[10px] font-bold text-amber-900 mb-1">KAZANDIĞIN HEDİYE:</p>
          <p id="txtWinnerPrize" class="text-lg sm:text-xl font-black text-amber-950 leading-snug">Meyve Suyu</p>
        </div>
        <button id="btnCloseModal" class="w-full py-3 bg-slate-950 hover:bg-slate-900 text-amber-400 font-extrabold text-sm rounded-xl transition-all shadow-lg flex items-center justify-center gap-2">
          <i data-lucide="check-circle" class="w-4 h-4"></i>
          <span>HEDİYEYİ TESLİM ET</span>
        </button>
      </div>

    </div>
  </div>

  <div id="customModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-3 hidden">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 max-w-xs w-full text-center shadow-2xl">
      <h3 id="customModalTitle" class="text-xs font-bold text-amber-400 mb-1.5 uppercase tracking-wider">BİLGİ</h3>
      <p id="customModalMessage" class="text-xs text-slate-200 mb-3 leading-relaxed">Mesaj metni buraya gelecek.</p>
      <div id="customModalButtons" class="flex gap-2">
        <button id="customModalOk" class="flex-1 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold text-xs rounded-xl shadow-md">Tamam</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://kfrlpvjpivkiojsowbzw.supabase.co'; 
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtmcmxwdmpwaXZraW9qc293Ynp3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3ODc3NTAsImV4cCI6MjEwNzM2Mzc1MH0.UrycoXFp2oqRGhYZG1DbYv00qfIG8muFUNENMxjnFVM';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let inventory = [];
    let drawnNumbers = [];
    let slotMapping = {};
    let isSpinning = false;

    function showNotification(title, message, onConfirm = null) {
      const modal = document.getElementById('customModal');
      const titleEl = document.getElementById('customModalTitle');
      const msgEl = document.getElementById('customModalMessage');
      const okBtn = document.getElementById('customModalOk');

      titleEl.textContent = title;
      msgEl.textContent = message;

      okBtn.onclick = () => {
        modal.classList.add('hidden');
        if (onConfirm) onConfirm(true);
      };

      modal.classList.remove('hidden');
    }

    function getTotalStock() {
      return inventory.reduce((acc, curr) => acc + (parseInt(curr.qty) || 0), 0);
    }

    function updateRemainingStats() {
      const totalStock = getTotalStock();
      document.getElementById('txtRemainingStats').textContent = `Kalan Hediye: ${totalStock}`;
    }

    let audioCtx = null;
    function playBeepSound(freq = 440, duration = 0.05) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.value = 0.08;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const startTime = audioCtx.currentTime;
        osc.start(startTime);
        osc.stop(startTime + duration);
      } catch (e) {}
    }

    function generateSlotMappingInMemory() {
      let mapping = {};
      let availableItems = inventory.filter(i => (parseInt(i.qty) || 0) > 0);
      
      if (availableItems.length === 0) {
        for (let i = 1; i <= 1000; i++) mapping[i] = "Stok Bitti";
        return mapping;
      }

      let pool = [];
      availableItems.forEach(item => {
        const weight = Math.max(1, parseInt(item.weight) || 1);
        for (let w = 0; w < weight * 10; w++) {
          pool.push(item.name);
        }
      });

      for (let num = 1; num <= 1000; num++) {
        const randomIndex = Math.floor(Math.random() * pool.length);
        mapping[num] = pool[randomIndex];
      }
      return mapping;
    }

    async function loadAppData() {
      const statusEl = document.getElementById('txtConnectionStatus');
      try {
        let { data: invData, error: invErr } = await supabaseClient.from('inventory').select('*');
        if (invErr) throw invErr;

        inventory = invData || [];
        localStorage.setItem('suzener_offline_inv', JSON.stringify(inventory));

        let { data: drawnData } = await supabaseClient.from('drawn_numbers').select('*');
        drawnNumbers = drawnData ? drawnData.map(d => d.draw_number) : [];
        localStorage.setItem('suzener_offline_drawn', JSON.stringify(drawnNumbers));

        let { data: mapData } = await supabaseClient.from('slot_mapping').select('*');
        if (!mapData || mapData.length === 0) {
          slotMapping = generateSlotMappingInMemory();
          await saveSlotMappingToCloud();
        } else {
          slotMapping = {};
          mapData.forEach(row => {
            slotMapping[row.slot_number] = row.prize_name;
          });
          localStorage.setItem('suzener_offline_map', JSON.stringify(slotMapping));
        }

        statusEl.textContent = "Bulut Bağlı (Senkronize)";
        statusEl.className = "text-[9px] font-semibold text-emerald-400";
      } catch (e) {
        statusEl.textContent = "Çevrimdışı Mod (Yerel Bellek)";
        statusEl.className = "text-[9px] font-semibold text-amber-400";

        const localInv = localStorage.getItem('suzener_offline_inv');
        inventory = localInv ? JSON.parse(localInv) : [];

        const localDrawn = localStorage.getItem('suzener_offline_drawn');
        drawnNumbers = localDrawn ? JSON.parse(localDrawn) : [];

        const localMap = localStorage.getItem('suzener_offline_map');
        slotMapping = localMap ? JSON.parse(localMap) : generateSlotMappingInMemory();
      }

      updateRemainingStats();
    }

    async function saveInventoryToCloud() {
      localStorage.setItem('suzener_offline_inv', JSON.stringify(inventory));
      try {
        await supabaseClient.from('inventory').upsert(inventory);
      } catch (e) {}
      updateRemainingStats();
    }

    async function saveSlotMappingToCloud() {
      localStorage.setItem('suzener_offline_map', JSON.stringify(slotMapping));
      try {
        const rows = Object.keys(slotMapping).map(num => ({
          slot_number: parseInt(num),
          prize_name: slotMapping[num]
        }));
        await supabaseClient.from('slot_mapping').upsert(rows);
      } catch (e) {}
    }

    window.addEventListener('online', async () => {
      document.getElementById('txtConnectionStatus').textContent = "İnternet Geldi, Eşitleniyor...";
      document.getElementById('txtConnectionStatus').className = "text-[9px] font-semibold text-blue-400";
      try {
        await saveInventoryToCloud();
        await saveSlotMappingToCloud();
        await loadAppData();
      } catch(e) {}
    });

    window.addEventListener('offline', () => {
      document.getElementById('txtConnectionStatus').textContent = "Çevrimdışı Mod (Yerel Bellek)";
      document.getElementById('txtConnectionStatus').className = "text-[9px] font-semibold text-amber-400";
    });

    function setupRealtimeSync() {
      try {
        supabaseClient
          .channel('public-db-changes')
          .on('postgres_changes', { event: '*', schema: 'public' }, payload => {
            loadAppData();
          })
          .subscribe();
      } catch(e) {}
    }

    async function startDraw() {
      if (isSpinning) return;
      
      const totalStock = getTotalStock();
      if (totalStock <= 0) {
        showNotification("Stok Bitti", "Tüm hediyelerin stoku bitti! Lütfen yönetim panelinden stok ekleyin.");
        return;
      }

      if (drawnNumbers.length >= 1000) {
        showNotification("Çekiliş Tamamlandı", "Tüm 1000 numara çekildi!");
        return;
      }

      let availableNums = [];
      for (let i = 1; i <= 1000; i++) {
        if (!drawnNumbers.includes(i)) {
          const prizeName = slotMapping[i];
          const matchItem = inventory.find(item => item.name === prizeName);
          if (matchItem && matchItem.qty > 0) {
            availableNums.push(i);
          }
        }
      }

      if (availableNums.length === 0) {
        slotMapping = generateSlotMappingInMemory();
        await saveSlotMappingToCloud();
        for (let i = 1; i <= 1000; i++) {
          if (!drawnNumbers.includes(i)) {
            const prizeName = slotMapping[i];
            const matchItem = inventory.find(item => item.name === prizeName);
            if (matchItem && matchItem.qty > 0) availableNums.push(i);
          }
        }
      }

      if (availableNums.length === 0) {
        showNotification("Hata", "Stokta verecek hediye kalmadı!");
        return;
      }

      const winNum = availableNums[Math.floor(Math.random() * availableNums.length)];
      const winPrize = slotMapping[winNum] || "Sürpriz Hediye";
      const winFormatted = String(winNum).padStart(3, '0');

      isSpinning = true;

      const modal = document.getElementById('modalResult');
      const animBall = document.getElementById('animBall');
      const animPaper = document.getElementById('animPaper');
      
      animBall.classList.remove('hidden');
      animBall.textContent = `#${Math.floor(Math.random() * 900 + 100)}`;
      animPaper.classList.add('hidden');
      modal.classList.remove('hidden');

      let tickCount = 0;
      const tickInterval = setInterval(() => {
        playBeepSound(500 + (tickCount % 4) * 80, 0.04);
        animBall.textContent = `#${Math.floor(Math.random() * 900 + 100)}`;
        tickCount++;
      }, 100);

      setTimeout(async () => {
        clearInterval(tickInterval);
        playBeepSound(880, 0.15);

        animBall.classList.add('hidden');
        animPaper.classList.remove('hidden');

        document.getElementById('txtWinnerNumber').textContent = `#${winFormatted}`;
        document.getElementById('txtWinnerPrize').textContent = winPrize;

        drawnNumbers.push(winNum);
        localStorage.setItem('suzener_offline_drawn', JSON.stringify(drawnNumbers));

        try {
          await supabaseClient.from('drawn_numbers').insert([{ draw_number: winNum, prize_name: winPrize }]);
        } catch (e) {}

        const invIndex = inventory.findIndex(item => item.name === winPrize);
        if (invIndex !== -1 && inventory[invIndex].qty > 0) {
          inventory[invIndex].qty -= 1;
          await saveInventoryToCloud();
        }

        try {
          confetti({ particleCount: 100, spread: 90, origin: { y: 0.6 } });
        } catch (e) {}

        isSpinning = false;
      }, 1500);
    }

    document.getElementById('fanusContainer').addEventListener('click', startDraw);

    document.getElementById('btnCloseModal').addEventListener('click', () => {
      document.getElementById('modalResult').classList.add('hidden');
    });

    window.onload = async function() {
      await loadAppData();
      setupRealtimeSync();
      try { lucide.createIcons(); } catch(e) {}
    };
  </script>

</body>
</html>
