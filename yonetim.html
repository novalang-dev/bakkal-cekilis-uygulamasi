<!DOCTYPE html>
<html lang="tr" class="h-full bg-blue-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Süzener Market - Yönetim Paneli</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Inter', sans-serif;
      user-select: none;
      background-color: #eff6ff;
      background-image: radial-gradient(#bfdbfe 1px, transparent 1px);
      background-size: 20px 20px;
    }
    
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    @keyframes slideUpFade {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-slide-up { animation: slideUpFade 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  </style>
</head>
<body class="text-slate-800 min-h-full flex flex-col p-4 sm:p-8">

  <header class="w-full max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between bg-white/80 backdrop-blur-md border border-blue-100 rounded-[2rem] px-6 py-4 shadow-[0_8px_30px_rgb(0,0,0,0.04)] mb-8 gap-4 z-10">
    <div class="flex items-center gap-4 w-full sm:w-auto">
      <div class="w-12 h-12 rounded-full bg-gradient-to-tr from-red-800 to-red-600 flex items-center justify-center shadow-lg shadow-red-800/30 text-white">
        <i data-lucide="settings" class="w-6 h-6"></i>
      </div>
      <div>
        <h1 class="text-lg sm:text-xl font-black tracking-tight text-blue-950">Yönetim Paneli <span class="text-xs text-red-800">v1.8.1</span></h1>
        <p id="txtConnectionStatus" class="text-[11px] font-bold text-emerald-500 flex items-center gap-1.5 mt-0.5 tracking-wide uppercase">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Bulut Bağlı
        </p>
      </div>
    </div>

    <div class="flex items-center justify-between sm:justify-end gap-3 w-full sm:w-auto">
      <span id="txtTotalTypes" class="text-xs bg-red-50 text-red-800 font-extrabold px-4 py-2.5 rounded-full border border-red-100 shadow-sm">
        0 Çeşit Hediye
      </span>
      
      <a href="logs.html" id="btnLogsLink" class="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-full text-xs font-extrabold transition-all shadow-md shadow-blue-600/20 active:scale-95 opacity-50 cursor-not-allowed pointer-events-none">
        <i data-lucide="activity" class="w-4 h-4"></i> Canlı Loglar
      </a>
    </div>
  </header>

  <div id="adminAuthBox" class="w-full max-w-md mx-auto my-auto bg-white/90 backdrop-blur-xl border border-blue-100 rounded-[2.5rem] p-10 text-center shadow-[0_20px_50px_rgb(0,0,0,0.05)] animate-slide-up">
    <div class="w-20 h-20 bg-red-50 border border-red-100 rounded-full flex items-center justify-center mx-auto mb-6 text-red-800 shadow-inner">
      <i data-lucide="lock" class="w-8 h-8"></i>
    </div>
    <h2 class="text-2xl font-black text-blue-950 mb-2 tracking-tight">Giriş Yap</h2>
    <p class="text-xs text-slate-500 font-medium mb-8 leading-relaxed">Devam etmek için lütfen yönetici PIN kodunu girin.</p>
    
    <div class="flex flex-col gap-3 max-w-xs mx-auto">
      <input type="password" id="inputAdminPin" placeholder="••••" class="w-full bg-blue-50 border border-blue-200 rounded-2xl px-4 py-4 text-center font-black tracking-[0.5em] text-blue-950 text-xl focus:outline-none focus:ring-4 focus:ring-blue-500/20 focus:border-blue-500 transition-all placeholder:tracking-normal placeholder:font-medium placeholder:text-slate-400">
      <button id="btnAdminLogin" class="w-full bg-red-800 hover:bg-red-900 text-white font-bold px-5 py-4 rounded-2xl text-sm transition-all shadow-lg shadow-red-800/20 active:scale-[0.98]">
        Panele Giriş Yap
      </button>
    </div>
  </div>

  <div id="viewAdminPanel" class="w-full max-w-6xl mx-auto hidden flex-col gap-6 flex-1">
      
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      
      <div class="bg-white border border-blue-100 rounded-[2rem] p-7 flex flex-col justify-between shadow-[0_8px_30px_rgb(0,0,0,0.04)] animate-slide-up">
        <div>
          <div class="flex items-center gap-3 mb-6">
            <div class="w-10 h-10 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center">
              <i data-lucide="shuffle" class="w-5 h-5"></i>
            </div>
            <h3 class="text-sm font-black text-blue-950 tracking-tight">Algoritma & Havuz</h3>
          </div>

          <div class="bg-blue-50/50 p-5 rounded-2xl border border-blue-100 flex items-center justify-between mb-8">
            <div>
              <span class="text-xs font-extrabold text-blue-950 block mb-1">Otomatik Karıştırma</span>
              <span class="text-[11px] text-slate-500 font-medium">Her gece 00:00'da havuzu yenile</span>
            </div>
            <label class="relative inline-flex items-center cursor-pointer">
              <input type="checkbox" id="chkAutoShuffle" class="sr-only peer" checked>
              <div class="w-12 h-7 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-6 after:w-6 after:transition-all after:shadow-sm peer-checked:bg-blue-600"></div>
            </label>
          </div>
        </div>

        <div class="flex flex-col sm:flex-row gap-3">
          <button id="btnShuffleNow" class="flex-1 py-4 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded-2xl flex items-center justify-center gap-2 transition-all shadow-lg shadow-blue-600/20 active:scale-[0.98]">
            <i data-lucide="refresh-cw" class="w-4 h-4"></i> Havuzu Karıştır
          </button>
          <button id="btnResetDraws" class="py-4 px-6 bg-white border border-red-200 hover:bg-red-50 text-red-700 font-bold text-xs rounded-2xl flex items-center justify-center gap-2 transition-all shadow-sm active:scale-[0.98]">
            <i data-lucide="rotate-ccw" class="w-4 h-4"></i> Sıfırla
          </button>
        </div>
      </div>

      <div class="bg-white border border-blue-100 rounded-[2rem] p-7 flex flex-col justify-between shadow-[0_8px_30px_rgb(0,0,0,0.04)] animate-slide-up" style="animation-delay: 0.1s;">
        <div>
          <div class="flex items-center gap-3 mb-6">
            <div class="w-10 h-10 rounded-full bg-red-50 text-red-800 flex items-center justify-center">
              <i data-lucide="plus-circle" class="w-5 h-5"></i>
            </div>
            <h3 class="text-sm font-black text-blue-950 tracking-tight">Yeni Hediye Tanımla</h3>
          </div>

          <div class="space-y-4">
            <div>
              <label class="text-[11px] font-bold text-slate-500 block mb-1.5 ml-1">Hediye Adı</label>
              <input type="text" id="inputNewItemName" placeholder="Örn: Çikolata" class="w-full bg-blue-50 border border-blue-100 rounded-2xl px-4 py-3.5 text-blue-950 placeholder-slate-400 focus:outline-none focus:ring-4 focus:ring-blue-500/10 focus:border-blue-400 text-sm font-semibold transition-all">
            </div>
            
            <div>
              <label class="text-[11px] font-bold text-slate-500 block mb-1.5 ml-1">Stok Adedi</label>
              <input type="number" id="inputNewItemQty" min="1" value="10" class="w-full bg-blue-50 border border-blue-100 rounded-2xl px-4 py-3.5 text-red-800 focus:outline-none focus:ring-4 focus:ring-red-500/10 focus:border-red-400 text-sm font-black transition-all">
            </div>
          </div>
        </div>

        <button id="btnAddInventoryItem" class="mt-6 w-full py-4 bg-red-800 hover:bg-red-900 text-white rounded-2xl text-xs font-bold flex items-center justify-center gap-2 transition-all shadow-lg shadow-red-800/20 active:scale-[0.98]">
          <i data-lucide="plus" class="w-4 h-4"></i> Hediyeyi Sisteme Ekle
        </button>
      </div>

    </div>

    <div class="bg-transparent flex flex-col flex-1 mt-2">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-5 px-1">
        <div class="flex items-center gap-3">
          <h3 class="text-lg font-black text-blue-950 tracking-tight">Mevcut Stoklar</h3>
          <span class="bg-blue-100 text-blue-800 text-[10px] font-bold px-2.5 py-1 rounded-full border border-blue-200">Adet = Şans</span>
        </div>
        
        <div class="relative w-full sm:w-72">
          <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-4 top-1/2 -translate-y-1/2"></i>
          <input type="text" id="inputSearchInventory" oninput="renderAdminInventory()" placeholder="Ürün ara..." class="w-full bg-white border border-blue-100 rounded-full pl-11 pr-4 py-2.5 text-blue-950 placeholder-slate-400 text-xs font-semibold focus:outline-none focus:ring-4 focus:ring-blue-500/10 focus:border-blue-400 shadow-sm transition-all">
        </div>
      </div>

      <div id="adminInventoryList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 overflow-y-auto max-h-[500px] pr-2 custom-scrollbar pb-10">
      </div>
    </div>
  </div>

  <div id="customModal" class="fixed inset-0 bg-blue-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden transition-opacity">
    <div class="bg-white border border-blue-100 rounded-[2rem] p-7 max-w-sm w-full text-center shadow-2xl animate-slide-up">
      <h3 id="customModalTitle" class="text-sm font-black text-blue-950 mb-2 tracking-tight">BİLGİ</h3>
      <p id="customModalMessage" class="text-xs text-slate-500 mb-6 leading-relaxed font-medium">Mesaj metni buraya gelecek.</p>
      <div id="customModalButtons" class="flex gap-3">
        <button id="customModalOk" class="flex-1 py-3 bg-blue-900 hover:bg-blue-950 text-white font-bold text-xs rounded-xl shadow-md transition-colors active:scale-95">Tamam</button>
        <button id="customModalCancel" class="flex-1 py-3 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold text-xs rounded-xl hidden transition-colors active:scale-95">İptal</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://kfrlpvjpivkiojsowbzw.supabase.co'; 
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtmcmxwdmpwaXZraW9qc293Ynp3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3ODc3NTAsImV4cCI6MjEwNzM2Mzc1MH0.UrycoXFp2oqRGhYZG1DbYv00qfIG8muFUNENMxjnFVM';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let inventory = [];
    let slotMapping = {};
    let autoShuffleEnabled = true;
    let lastShuffleDate = '';
    let currentAdminPin = '1234';
    
    let isAuthenticated = false;
    const btnLogsLink = document.getElementById('btnLogsLink');

    btnLogsLink.addEventListener('click', (e) => {
      if (!isAuthenticated) {
        e.preventDefault();
        showNotification("Giriş Gerekli", "Canlı logları görüntülemek için lütfen önce yönetici şifrenizi girin.");
      }
    });

    function showNotification(title, message, isConfirm = false, onConfirm = null) {
      const modal = document.getElementById('customModal');
      const titleEl = document.getElementById('customModalTitle');
      const msgEl = document.getElementById('customModalMessage');
      const okBtn = document.getElementById('customModalOk');
      const cancelBtn = document.getElementById('customModalCancel');

      titleEl.textContent = title;
      msgEl.textContent = message;

      okBtn.onclick = () => {
        modal.classList.add('hidden');
        if (onConfirm) onConfirm(true);
      };

      if (isConfirm) {
        cancelBtn.classList.remove('hidden');
        cancelBtn.onclick = () => {
          modal.classList.add('hidden');
          if (onConfirm) onConfirm(false);
        };
      } else {
        cancelBtn.classList.add('hidden');
      }

      modal.classList.remove('hidden');
    }

    function generateSlotMappingInMemory() {
      let mapping = {};
      let availableItems = inventory.filter(i => (parseInt(i.qty) || 0) > 0);
      
      if (availableItems.length === 0) {
        for (let i = 1; i <= 1000; i++) mapping[i] = "Stok Bitti";
        return mapping;
      }

      let pool = [];
      availableItems.forEach(item => {
        const weight = Math.max(1, parseInt(item.qty) || 1);
        item.weight = weight; 
        for (let w = 0; w < weight * 10; w++) {
          pool.push(item.name);
        }
      });

      for (let num = 1; num <= 1000; num++) {
        const randomIndex = Math.floor(Math.random() * pool.length);
        mapping[num] = pool[randomIndex];
      }
      return mapping;
    }

    async function fetchAdminPin() {
      try {
        let { data } = await supabaseClient.from('app_settings').select('value').eq('key', 'admin_pin').single();
        if (data && data.value) currentAdminPin = data.value;
      } catch (e) {}
    }

    async function loadAppData() {
      try {
        let { data: invData, error: invErr } = await supabaseClient.from('inventory').select('*');
        if (invErr) throw invErr;
        
        inventory = (invData || []).map(item => ({
          ...item,
          weight: Math.max(1, parseInt(item.qty) || 1)
        }));

        let { data: mapData } = await supabaseClient.from('slot_mapping').select('*');
        if (!mapData || mapData.length === 0) {
          slotMapping = generateSlotMappingInMemory();
          await saveSlotMappingToCloud();
        } else {
          slotMapping = {};
          mapData.forEach(row => { slotMapping[row.slot_number] = row.prize_name; });
        }

        let { data: settingsData } = await supabaseClient.from('app_settings').select('*');
        if (settingsData) {
          settingsData.forEach(s => {
            if (s.key === 'auto_shuffle') autoShuffleEnabled = s.value === 'true';
            if (s.key === 'last_shuffle_date') lastShuffleDate = s.value;
          });
        }

        renderAdminInventory();
      } catch (e) {
        document.getElementById('txtConnectionStatus').textContent = "Bağlantı Hatası";
        document.getElementById('txtConnectionStatus').className = "text-[11px] font-bold text-red-600 uppercase tracking-wide";
      }
    }

    async function saveInventoryToCloud() {
      try {
        const cleanInventory = inventory.map(item => ({
          id: item.id,
          name: item.name,
          qty: parseInt(item.qty) || 0,
          weight: parseInt(item.qty) || 1 
        }));
        await supabaseClient.from('inventory').upsert(cleanInventory, { onConflict: 'id' });
      } catch (e) {}
      renderAdminInventory();
    }

    async function saveSlotMappingToCloud() {
      try {
        const rows = Object.keys(slotMapping).map(num => ({
          slot_number: parseInt(num),
          prize_name: slotMapping[num]
        }));
        await supabaseClient.from('slot_mapping').upsert(rows, { onConflict: 'slot_number' });
      } catch (e) {}
    }

    async function saveSettingsToCloud() {
      try {
        await supabaseClient.from('app_settings').upsert([
          { key: 'auto_shuffle', value: String(autoShuffleEnabled) },
          { key: 'last_shuffle_date', value: lastShuffleDate }
        ], { onConflict: 'key' });
      } catch (e) {}
    }

    function renderAdminInventory() {
      const container = document.getElementById('adminInventoryList');
      const query = document.getElementById('inputSearchInventory').value.trim().toLowerCase();

      const filteredInventory = inventory.map((item, originalIndex) => ({ item, originalIndex }))
        .filter(({ item }) => item.name.toLowerCase().includes(query));

      if (filteredInventory.length === 0) {
        container.innerHTML = `
          <div class="col-span-full py-12 text-center bg-white border border-blue-200 border-dashed rounded-[2rem]">
            <div class="w-16 h-16 bg-blue-50 rounded-full flex items-center justify-center mx-auto mb-3">
              <i data-lucide="package-search" class="w-6 h-6 text-blue-400"></i>
            </div>
            <p class="text-sm font-bold text-blue-950 mb-1">${query ? 'Ürün Bulunamadı' : 'Stok Listesi Boş'}</p>
            <p class="text-xs text-slate-500 font-medium">${query ? 'Farklı bir kelime ile arama yapın.' : 'Yukarıdan yeni bir hediye tanımlayın.'}</p>
          </div>
        `;
      } else {
        container.innerHTML = filteredInventory.map(({ item, originalIndex }) => {
          const qtyVal = item.qty !== undefined ? item.qty : 10;
          
          return `
            <div class="bg-white border border-blue-100 rounded-3xl p-5 flex flex-col justify-between shadow-[0_4px_20px_rgb(0,0,0,0.03)] hover:shadow-[0_8px_30px_rgb(0,0,0,0.06)] transition-all group">
              <div class="flex items-start justify-between mb-4">
                <div class="pr-2">
                  <h4 class="font-extrabold text-blue-950 text-sm leading-tight line-clamp-2">${item.name}</h4>
                  <p class="text-[10px] text-slate-400 font-semibold mt-1">ID: #${item.id.toString().slice(-4)}</p>
                </div>
                <button onclick="removeInventoryItem(${originalIndex})" class="w-8 h-8 rounded-full bg-slate-50 text-slate-400 hover:bg-red-50 hover:text-red-600 flex items-center justify-center transition-colors flex-shrink-0 opacity-50 group-hover:opacity-100 border border-transparent hover:border-red-100">
                  <i data-lucide="trash-2" class="w-4 h-4"></i>
                </button>
              </div>
              <div class="flex items-center justify-between gap-3">
                <div class="flex-1 bg-blue-50/50 rounded-2xl border border-blue-100 p-2 flex items-center">
                  <input type="number" min="0" value="${qtyVal}" onchange="updateItemQty(${originalIndex}, this.value)" class="w-full bg-transparent text-center font-black text-blue-950 focus:outline-none text-lg appearance-none m-0 p-0">
                </div>
                <div class="flex flex-col items-end">
                  <span class="text-[9px] font-bold text-slate-400 uppercase tracking-wider mb-0.5">Şans</span>
                  <span class="text-xs font-black text-red-700 bg-red-50/80 px-3 py-1.5 rounded-lg border border-red-100/50">${qtyVal} Puan</span>
                </div>
              </div>
            </div>
          `;
        }).join('');
      }
      
      document.getElementById('txtTotalTypes').textContent = `${inventory.length} Çeşit Hediye`;
      try { lucide.createIcons(); } catch (e) {}
    }

    window.updateItemQty = async function(idx, val) {
      const newQty = parseInt(val) || 0;
      inventory[idx].qty = newQty;
      inventory[idx].weight = Math.max(1, newQty);
      
      slotMapping = generateSlotMappingInMemory();
      await saveInventoryToCloud();
      await saveSlotMappingToCloud();
    };

    window.removeInventoryItem = async function(idx) {
      const removedItem = inventory[idx];
      inventory.splice(idx, 1);
      slotMapping = generateSlotMappingInMemory();

      try {
        if (removedItem && removedItem.id) {
          await supabaseClient.from('inventory').delete().eq('id', removedItem.id);
        }
      } catch (e) {}

      await saveInventoryToCloud();
      await saveSlotMappingToCloud();
    };

    document.getElementById('btnAdminLogin').addEventListener('click', async () => {
      await fetchAdminPin();
      const pin = document.getElementById('inputAdminPin').value;
      
      if (pin === currentAdminPin) {
        isAuthenticated = true;
        
        document.getElementById('adminAuthBox').classList.add('hidden');
        document.getElementById('viewAdminPanel').classList.remove('hidden');
        document.getElementById('viewAdminPanel').classList.add('flex');
        
        btnLogsLink.classList.remove('opacity-50', 'cursor-not-allowed', 'pointer-events-none');
        
        await loadAppData();

        const chk = document.getElementById('chkAutoShuffle');
        if (chk) {
          chk.checked = autoShuffleEnabled;
          chk.onchange = async (e) => {
            autoShuffleEnabled = e.target.checked;
            await saveSettingsToCloud();
          };
        }
        
        setupApprovalListener();
      } else {
        showNotification("Giriş Başarısız", "Hatalı PIN Kodu girdiniz. Lütfen tekrar deneyin.");
      }
    });

    document.getElementById('btnAddInventoryItem').addEventListener('click', async () => {
      const name = document.getElementById('inputNewItemName').value.trim();
      const qty = parseInt(document.getElementById('inputNewItemQty').value) || 1;
      const weight = Math.max(1, qty); 

      if (name) {
        inventory.push({ id: Date.now(), name, qty, weight });
        document.getElementById('inputNewItemName').value = '';
        slotMapping = generateSlotMappingInMemory();
        await saveInventoryToCloud();
        await saveSlotMappingToCloud();
        showNotification("Başarılı", `"${name}" sisteme eklendi. Çıkma şansı stok adedine göre ayarlandı.`);
      } else {
        showNotification("Uyarı", "Lütfen geçerli bir hediye adı girin.");
      }
    });

    document.getElementById('btnShuffleNow').addEventListener('click', async () => {
      slotMapping = generateSlotMappingInMemory();
      await saveSlotMappingToCloud();
      showNotification("Başarılı", "Havuz güncel stoklara göre yeniden karıştırıldı.");
    });

    document.getElementById('btnResetDraws').addEventListener('click', () => {
      showNotification("Emin misiniz?", "Çekilen tüm numaralar sıfırlanacak. Bu işlem geri alınamaz!", true, async (confirmed) => {
        if (confirmed) {
          try {
            await supabaseClient.from('drawn_numbers').delete().neq('draw_number', 0);
          } catch(e) {}
          slotMapping = generateSlotMappingInMemory();
          await saveSlotMappingToCloud();
          showNotification("Sıfırlandı", "Çekiliş geçmişi temizlendi, sistem sıfırlandı.");
        }
      });
    });

    // ==========================================
    // YENİ: Kasiyer Onay Dinleyicisi
    // ==========================================
    async function checkPendingApproval() {
      try {
        const { data } = await supabaseClient.from('app_settings').select('value').eq('key', 'request_status').single();
        if (data && data.value && data.value.startsWith('pending')) {
          showApprovalPopup();
        }
      } catch(e) {}
    }

    function setupApprovalListener() {
      checkPendingApproval(); // Sayfa açıldığında kontrol et

      supabaseClient
        .channel('public-request-approval')
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'app_settings' }, payload => {
          if (payload.new.key === 'request_status' && payload.new.value.startsWith('pending')) {
            showApprovalPopup();
          }
        })
        .subscribe();
    }

    function showApprovalPopup() {
      if (Swal.isVisible()) return;

      let timerInterval;
      Swal.fire({
        title: 'Müşteri Çekiliş İstiyor!',
        html: "Bir müşteri çekiliş yapmak için onay bekliyor.<br><b>Kalan Süre: <span id='swal-timer'>60</span> sn</b>",
        icon: 'question',
        showCancelButton: true,
        confirmButtonColor: '#1e40af',
        cancelButtonColor: '#991b1b',
        confirmButtonText: 'Evet, Onayla',
        cancelButtonText: 'İptal Et',
        allowOutsideClick: false,
        allowEscapeKey: false,
        didOpen: () => {
          const timerEl = document.getElementById('swal-timer');
          let timeLeft = 60;
          timerInterval = setInterval(() => {
            timeLeft--;
            if (timerEl) timerEl.textContent = timeLeft;
            if (timeLeft <= 0) {
              clearInterval(timerInterval);
              Swal.close();
              supabaseClient.from('app_settings').upsert({ key: 'request_status', value: 'rejected' }, { onConflict: 'key' });
            }
          }, 1000);
        },
        willClose: () => {
          clearInterval(timerInterval);
        }
      }).then(async (result) => {
        if (result.isConfirmed) {
          await supabaseClient.from('app_settings').upsert({ key: 'request_status', value: 'approved' }, { onConflict: 'key' });
        } else {
          await supabaseClient.from('app_settings').upsert({ key: 'request_status', value: 'rejected' }, { onConflict: 'key' });
        }
      });
    }

    window.onload = async function() {
      await fetchAdminPin();
      try { lucide.createIcons(); } catch(e) {}
    };
  </script>

</body>
</html>
