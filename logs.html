<!DOCTYPE html>
<html lang="tr" class="h-full bg-blue-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Süzener Market - Çekiliş Logları</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800;900&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Inter', sans-serif;
      user-select: none;
      background-color: #eff6ff;
      background-image: radial-gradient(#bfdbfe 1px, transparent 1px);
      background-size: 20px 20px;
    }
    
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #bfdbfe; border-radius: 10px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #93c5fd; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }

    .date-separator {
      display: flex;
      align-items: center;
      margin: 1.5rem 0 1rem 0;
      position: relative;
    }
    .date-separator-line {
      flex-grow: 1;
      height: 2px;
      background-color: #bfdbfe;
      border-radius: 2px;
    }
    .date-separator-text {
      margin-left: 12px;
      font-size: 11px;
      font-weight: 800;
      color: #1e40af;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      white-space: nowrap;
    }
  </style>
</head>
<body class="text-slate-800 min-h-full flex flex-col p-3 sm:p-6">

  <!-- Üst Header -->
  <header class="w-full max-w-4xl mx-auto flex flex-col sm:flex-row items-center justify-between bg-white border-2 border-blue-100 rounded-3xl px-4 py-3 shadow-xl mb-4 sm:mb-6 gap-3">
    <div class="flex items-center gap-3 w-full sm:w-auto">
      <div class="w-12 h-12 rounded-2xl bg-red-800 flex items-center justify-center shadow-md text-white font-black text-xl">
        <i data-lucide="bar-chart-3" class="w-6 h-6"></i>
      </div>
      <div>
        <h1 class="text-sm sm:text-base font-black tracking-wide text-blue-900 uppercase">CANLI ÇEKİLİŞ LOGLARI</h1>
        <p id="txtLiveStatus" class="text-[10px] font-bold text-emerald-600 flex items-center gap-1.5 mt-0.5">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Canlı Dinleniyor (Realtime)
        </p>
      </div>
    </div>

    <div class="flex items-center justify-between sm:justify-end gap-2 w-full sm:w-auto">
      <span id="txtTotalWins" class="text-[11px] bg-red-50 text-red-800 font-bold px-3 py-2 rounded-xl border border-red-200">
        Toplam: 0 Kazanım
      </span>
      
      <a href="yonetim.html" class="flex items-center gap-1.5 bg-blue-600 hover:bg-blue-700 text-white px-3.5 py-2 rounded-xl text-[11px] font-bold transition-all shadow-sm">
        <i data-lucide="arrow-left" class="w-4 h-4"></i> Panele Dön
      </a>
    </div>
  </header>

  <!-- LOGLAR LİSTESİ VE FİLTRE BÖLÜMÜ -->
  <main class="w-full max-w-4xl mx-auto flex flex-col flex-1 bg-white border-2 border-blue-100 rounded-3xl p-4 sm:p-5 shadow-xl overflow-hidden">
    
    <!-- Üst Kontrol & Filtre Barları -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4 pb-4 border-b border-blue-100 flex-shrink-0">
      
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-blue-50 flex items-center justify-center border border-blue-100">
          <i data-lucide="list-ordered" class="w-4 h-4 text-blue-600"></i>
        </div>
        <div>
          <h3 class="text-sm font-extrabold text-blue-900 uppercase tracking-wider">Zaman Tüneli</h3>
          <span id="txtFilteredCount" class="text-xs font-bold text-blue-800">0 Çekiliş Listeleniyor</span>
        </div>
      </div>

      <div class="flex flex-wrap items-center gap-2 w-full sm:w-auto">
        <div class="flex items-center gap-1.5 bg-blue-50 border border-blue-200 px-2.5 py-1.5 rounded-xl">
          <i data-lucide="calendar" class="w-3.5 h-3.5 text-blue-600"></i>
          <select id="selectDateFilter" onchange="renderLogs()" class="bg-transparent text-blue-900 text-xs font-bold focus:outline-none cursor-pointer">
            <option value="all" class="bg-white text-slate-800">Tüm Günler</option>
          </select>
        </div>

        <div class="flex items-center gap-1.5 bg-blue-50 border border-blue-200 px-2.5 py-1.5 rounded-xl">
          <i data-lucide="arrow-up-down" class="w-3.5 h-3.5 text-blue-600"></i>
          <select id="selectSortOrder" onchange="renderLogs()" class="bg-transparent text-blue-900 text-xs font-bold focus:outline-none cursor-pointer">
            <option value="desc" class="bg-white text-slate-800">En Yeni İlk</option>
            <option value="asc" class="bg-white text-slate-800">En Eski İlk</option>
          </select>
        </div>
      </div>

    </div>

    <!-- Log Listesi -->
    <div id="logsContainer" class="overflow-y-auto space-y-2 pr-2 custom-scrollbar flex-1">
      <div class="text-center py-12 text-slate-400 text-xs font-semibold">Loglar yükleniyor...</div>
    </div>
  </main>

  <!-- SİLME ONAY MODALI -->
  <div id="deleteModal" class="fixed inset-0 bg-blue-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden transition-opacity">
    <div class="bg-white border border-blue-100 rounded-3xl p-7 max-w-sm w-full text-center shadow-2xl animate-fade-in">
      <div class="w-16 h-16 bg-red-50 border border-red-100 rounded-full flex items-center justify-center mx-auto mb-4 text-red-600 shadow-inner">
        <i data-lucide="trash-2" class="w-8 h-8"></i>
      </div>
      <h3 class="text-lg font-black text-blue-950 mb-2 tracking-tight">Logu Sil</h3>
      <p id="deleteModalMessage" class="text-xs text-slate-500 mb-6 leading-relaxed font-medium">Bu çekiliş kaydını silmek istediğinize emin misiniz? Bu işlem geri alınamaz.</p>
      <div class="flex gap-3">
        <button id="btnCancelDelete" class="flex-1 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs rounded-xl transition-colors active:scale-95">İptal</button>
        <button id="btnConfirmDelete" class="flex-1 py-3 bg-red-800 hover:bg-red-900 text-white font-bold text-xs rounded-xl shadow-md transition-colors active:scale-95">Evet, Sil</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://kfrlpvjpivkiojsowbzw.supabase.co'; 
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtmcmxwdmpwaXZraW9qc293Ynp3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3ODc3NTAsImV4cCI6MjEwNzM2Mzc1MH0.UrycoXFp2oqRGhYZG1DbYv00qfIG8muFUNENMxjnFVM';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let logsList = [];
    let logTimestampToDelete = null; // Silinecek kaydın zaman damgasını tutacağız

    window.openDeleteModal = function(drawNumber, prizeName, timestamp) {
      logTimestampToDelete = timestamp;
      document.getElementById('deleteModalMessage').innerHTML = `<strong class="text-blue-900">"${prizeName}"</strong> (Numara: #${drawNumber}) isimli bu çekiliş kaydını silmek istediğinize emin misiniz?`;
      document.getElementById('deleteModal').classList.remove('hidden');
      try { lucide.createIcons(); } catch(e) {}
    };

    window.closeDeleteModal = function() {
      document.getElementById('deleteModal').classList.add('hidden');
      logTimestampToDelete = null;
    };

    document.getElementById('btnConfirmDelete').addEventListener('click', async () => {
      if (!logTimestampToDelete) return;

      const btn = document.getElementById('btnConfirmDelete');
      const originalText = btn.innerHTML;
      btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Siliniyor...`;
      btn.disabled = true;
      try { lucide.createIcons(); } catch(e) {}

      try {
        // GÜNCELLEME: Silme işlemi artık zaman damgası (drawn_at) ile yapılıyor
        const { error } = await supabaseClient
          .from('drawn_numbers')
          .delete()
          .eq('drawn_at', logTimestampToDelete);

        if (error) throw error;

        // Ekrandaki listeden de ilgili zaman damgasına sahip kaydı siliyoruz
        logsList = logsList.filter(log => log.drawn_at !== logTimestampToDelete);
        
        closeDeleteModal();
        populateDateOptions();
        renderLogs();

      } catch (error) {
        console.error(error);
        alert("Silme işlemi sırasında bir hata oluştu.");
      } finally {
        btn.innerHTML = originalText;
        btn.disabled = false;
        try { lucide.createIcons(); } catch(e) {}
      }
    });

    document.getElementById('btnCancelDelete').addEventListener('click', closeDeleteModal);

    async function fetchLogs() {
      try {
        let { data, error } = await supabaseClient
          .from('drawn_numbers')
          .select('*')
          .order('drawn_at', { ascending: false });

        if (error) throw error;
        logsList = data || [];
        
        populateDateOptions();
        renderLogs();
      } catch (e) {
        document.getElementById('logsContainer').innerHTML = `<div class="text-center py-12 text-red-600 text-xs font-bold">Loglar yüklenirken hata oluştu.</div>`;
      }
    }

    function populateDateOptions() {
      const select = document.getElementById('selectDateFilter');
      const currentValue = select.value;
      
      const uniqueDates = new Set();
      logsList.forEach(log => {
        if (log.drawn_at) {
          const d = new Date(log.drawn_at);
          if (!isNaN(d.getTime())) {
            uniqueDates.add(d.toISOString().split('T')[0]);
          }
        }
      });

      select.innerHTML = `<option value="all" class="bg-white text-slate-800">Tüm Günler</option>`;

      Array.from(uniqueDates).sort().reverse().forEach(dateStr => {
        const d = new Date(dateStr + 'T00:00:00');
        const formattedDate = d.toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' });
        
        const opt = document.createElement('option');
        opt.value = dateStr;
        opt.className = 'bg-white text-slate-800 font-semibold';
        opt.textContent = formattedDate;
        select.appendChild(opt);
      });

      if (Array.from(select.options).some(o => o.value === currentValue)) {
        select.value = currentValue;
      }
    }

    function renderLogs() {
      const container = document.getElementById('logsContainer');
      const dateFilter = document.getElementById('selectDateFilter').value;
      const sortOrder = document.getElementById('selectSortOrder').value;

      document.getElementById('txtTotalWins').textContent = `Toplam: ${logsList.length} Kazanım`;

      if (logsList.length === 0) {
        container.innerHTML = `<div class="text-center py-12 text-slate-400 text-xs font-semibold">Henüz hiç çekiliş yapılmamış.</div>`;
        document.getElementById('txtFilteredCount').textContent = `0 Çekiliş Listeleniyor`;
        return;
      }

      let filteredLogs = logsList.filter(log => {
        if (dateFilter === 'all') return true;
        if (!log.drawn_at) return false;
        return new Date(log.drawn_at).toISOString().split('T')[0] === dateFilter;
      });

      document.getElementById('txtFilteredCount').textContent = `${filteredLogs.length} Çekiliş Listeleniyor`;

      if (filteredLogs.length === 0) {
        container.innerHTML = `<div class="text-center py-12 text-slate-400 text-xs font-semibold">Seçtiğiniz günde çekiliş yapılmamış.</div>`;
        return;
      }

      filteredLogs.sort((a, b) => {
        const timeA = new Date(a.drawn_at || 0).getTime();
        const timeB = new Date(b.drawn_at || 0).getTime();
        return sortOrder === 'desc' ? timeB - timeA : timeA - timeB;
      });

      let htmlContent = '';
      let lastDateStr = '';

      filteredLogs.forEach((log, index) => {
        const dateObj = new Date(log.drawn_at);
        let dateStr = 'Bilinmeyen Tarih';
        let displayDate = 'Tarih Yok';

        if (!isNaN(dateObj.getTime())) {
          dateStr = dateObj.toISOString().split('T')[0];
          displayDate = dateObj.toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' });
        }

        if (dateStr !== lastDateStr) {
          if (index !== 0) {
             htmlContent += `<div class="h-2"></div>`; 
          }

          htmlContent += `
            <div class="date-separator animate-fade-in">
              <div class="date-separator-line"></div>
              <div class="date-separator-text flex items-center gap-1.5">
                <i data-lucide="calendar" class="w-3.5 h-3.5"></i> ${displayDate}
              </div>
            </div>
          `;
          
          lastDateStr = dateStr;
        }

        const formattedNum = String(log.draw_number).padStart(3, '0');
        const timeStr = !isNaN(dateObj.getTime()) ? dateObj.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) : 'Şimdi';

        const isLatest = (index === 0 && sortOrder === 'desc' && dateFilter === 'all');
        const safePrizeName = log.prize_name.replace(/'/g, "\\'");
        
        // GÜNCELLEME: Sil butonuna artık tarihi (drawn_at) gönderiyoruz
        htmlContent += `
          <div class="p-3.5 ${isLatest ? 'bg-red-50 border-red-200' : 'bg-blue-50/50 border-blue-100'} border rounded-2xl flex items-center justify-between shadow-sm mb-2 group">
            <div class="flex items-center gap-3">
              
              <div class="w-12 h-12 rounded-xl ${isLatest ? 'bg-red-800 text-white' : 'bg-white text-blue-900 border border-blue-200'} flex items-center justify-center font-black text-sm shadow-sm">
                ${formattedNum}
              </div>
              
              <div>
                <p class="text-[9px] font-bold ${isLatest ? 'text-red-700' : 'text-slate-500'} uppercase tracking-wider mb-0.5">Kazanılan Hediye</p>
                <h4 class="text-sm font-extrabold text-blue-950">${log.prize_name}</h4>
              </div>
            </div>
            
            <div class="flex items-center gap-2">
              <!-- Sil butonuna log.drawn_at parametresi eklendi -->
              <button data-num="${log.draw_number}" data-prize="${safePrizeName}" data-time="${log.drawn_at}" onclick="openDeleteModal(this.getAttribute('data-num'), this.getAttribute('data-prize'), this.getAttribute('data-time'))" class="w-8 h-8 rounded-full bg-red-50 text-red-600 hover:bg-red-100 hover:text-red-800 flex items-center justify-center transition-all shadow-sm border border-red-100/50 opacity-0 group-hover:opacity-100 focus:opacity-100">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
              </button>

              <span class="text-[10px] bg-white text-slate-600 font-bold px-2.5 py-1 rounded-lg border border-blue-100 shadow-sm flex items-center gap-1">
                <i data-lucide="clock" class="w-3 h-3 text-blue-500"></i> ${timeStr}
              </span>
            </div>
          </div>
        `;
      });

      container.innerHTML = htmlContent;
      try { lucide.createIcons(); } catch(e) {}
    }

    function setupRealtimeLogs() {
      supabaseClient
        .channel('public:drawn_numbers')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'drawn_numbers' }, payload => {
          logsList.unshift(payload.new);
          populateDateOptions();
          renderLogs();
        })
        .subscribe();
    }

    window.onload = async function() {
      await fetchLogs();
      setupRealtimeLogs();
      try { lucide.createIcons(); } catch(e) {}
    };
  </script>

</body>
</html>
