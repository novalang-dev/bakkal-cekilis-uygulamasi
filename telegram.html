<!DOCTYPE html>
<html lang="tr" class="h-full bg-blue-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Süzener Market - Telegram Yönetim</title>

  <!-- Telegram Web App SDK & Supabase -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800;900&display=swap" rel="stylesheet">

  <style>
    body { 
      font-family: 'Inter', sans-serif; 
      user-select: none; 
      background-color: #eff6ff;
      background-image: radial-gradient(#bfdbfe 1px, transparent 1px);
      background-size: 20px 20px;
    }
    
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #bfdbfe; border-radius: 4px; }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }

    /* Zaman Tüneli Çizgisi */
    .date-separator {
      display: flex;
      align-items: center;
      margin: 1rem 0 0.5rem 0;
      position: relative;
    }
    .date-separator-line {
      flex-grow: 1;
      height: 2px;
      background-color: #bfdbfe;
      border-radius: 2px;
    }
    .date-separator-text {
      margin-left: 10px;
      font-size: 10px;
      font-weight: 800;
      color: #1e40af;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      white-space: nowrap;
    }
  </style>
</head>
<body class="text-slate-800 p-3 min-h-full flex flex-col justify-center">

  <!-- YETKİSİZ ERİŞİM EKRANI -->
  <div id="authErrorBox" class="hidden text-center bg-white border-2 border-red-200 p-6 rounded-3xl max-w-xs mx-auto shadow-xl">
    <div class="w-12 h-12 bg-red-50 text-red-600 rounded-2xl flex items-center justify-center mx-auto mb-3 font-black text-xl border border-red-100">
      <i data-lucide="shield-alert" class="w-6 h-6"></i>
    </div>
    <h2 class="text-sm font-extrabold text-red-800 mb-1 uppercase tracking-wider">Yetkisiz Erişim</h2>
    <p class="text-xs text-slate-600 leading-relaxed font-semibold">Bu yönetim panelini kullanma yetkiniz bulunmuyor.</p>
  </div>

  <!-- ANA YÖNETİM PANELİ -->
  <main id="mainPanel" class="hidden flex-col flex-1 min-h-full max-w-md mx-auto w-full">
    
    <!-- Üst Bilgi Kartı -->
    <div class="bg-white border-2 border-blue-100 rounded-3xl p-4 mb-3 flex items-center justify-between shadow-lg">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-red-800 flex items-center justify-center shadow-md text-white">
          <i data-lucide="settings" class="w-5 h-5"></i>
        </div>
        <div>
          <h1 class="text-xs font-black text-blue-900 uppercase tracking-wider">SÜZENER TELEGRAM</h1>
          <p id="txtTgUser" class="text-[10px] font-semibold text-slate-500">Giriş Yapıldı</p>
        </div>
      </div>
      <span id="txtHeaderStats" class="text-[11px] bg-red-50 text-red-800 font-bold px-3 py-1.5 rounded-xl border border-red-200 shadow-sm">
        0 Çeşit
      </span>
    </div>

    <!-- SEKMELER (TAB MENU) -->
    <div class="flex bg-white border-2 border-blue-100 p-1 rounded-2xl mb-3 gap-1 shadow-sm">
      <button id="tabBtnStock" onclick="switchTab('stock')" class="flex-1 py-2.5 rounded-xl text-xs font-extrabold bg-blue-600 text-white shadow-md transition-all flex items-center justify-center gap-1.5">
        <i data-lucide="box" class="w-4 h-4"></i> Stok Yönetimi
      </button>
      <button id="tabBtnLogs" onclick="switchTab('logs')" class="flex-1 py-2.5 rounded-xl text-xs font-extrabold text-slate-500 hover:text-blue-700 hover:bg-blue-50 transition-all flex items-center justify-center gap-1.5">
        <i data-lucide="history" class="w-4 h-4"></i> Çekiliş Logları
      </button>
    </div>

    <!-- ==================== TAB 1: STOK YÖNETİMİ ==================== -->
    <div id="tabStockContent" class="flex-1 flex flex-col">
      
      <!-- İşlem Butonları -->
      <div class="grid grid-cols-2 gap-2 mb-3">
        <button id="btnTgShuffle" class="py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-2xl font-black text-xs active:scale-95 transition-all flex items-center justify-center gap-1.5 shadow-md">
          <i data-lucide="refresh-cw" class="w-4 h-4"></i> Havuzu Karıştır
        </button>
        <button id="btnTgReset" class="py-3 bg-red-50 border-2 border-red-200 hover:bg-red-100 text-red-700 rounded-2xl font-black text-xs active:scale-95 transition-all flex items-center justify-center gap-1.5 shadow-sm">
          <i data-lucide="rotate-ccw" class="w-4 h-4"></i> Çekilişi Sıfırla
        </button>
      </div>

      <!-- Arama Kutusu -->
      <div class="relative mb-3">
        <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
        <input type="text" id="inputTgSearch" oninput="renderTgInventory()" placeholder="Telegram'da ürün ara..." class="w-full bg-white border-2 border-blue-100 rounded-2xl pl-10 pr-4 py-3 text-slate-800 placeholder-slate-400 text-xs font-bold focus:outline-none focus:border-blue-400 shadow-sm transition-colors">
      </div>

      <!-- Stok Listesi -->
      <div class="bg-white border-2 border-blue-100 rounded-3xl p-4 shadow-xl flex-1 flex flex-col">
        <div class="flex items-center justify-between mb-3 pb-2 border-b border-blue-50">
          <span class="text-[11px] font-extrabold text-blue-900 uppercase tracking-wider">Hızlı Stok Güncelleme</span>
          <span id="txtSyncStatus" class="text-[10px] text-emerald-600 font-bold bg-emerald-50 px-2 py-0.5 rounded border border-emerald-100">Senkronize</span>
        </div>

        <div id="tgInventoryList" class="space-y-2 overflow-y-auto max-h-[360px] pr-1 custom-scrollbar flex-1">
          <div class="text-center py-8 text-slate-400 text-xs font-semibold">Stoklar yükleniyor...</div>
        </div>
      </div>
    </div>

    <!-- ==================== TAB 2: CANLI LOGLAR ==================== -->
    <div id="tabLogsContent" class="hidden flex-1 flex-col">
      
      <!-- Log Filtreleme Barları -->
      <div class="flex items-center justify-between gap-2 mb-3">
        <div class="flex-1 flex items-center gap-1.5 bg-white border-2 border-blue-100 px-3 py-2 rounded-xl shadow-sm">
          <i data-lucide="calendar" class="w-4 h-4 text-blue-600"></i>
          <select id="selectTgDateFilter" onchange="renderTgLogs()" class="bg-transparent text-blue-900 text-xs font-bold focus:outline-none w-full cursor-pointer">
            <option value="all" class="bg-white text-slate-800">Tüm Günler</option>
          </select>
        </div>

        <div class="flex items-center gap-1.5 bg-white border-2 border-blue-100 px-3 py-2 rounded-xl shadow-sm">
          <i data-lucide="arrow-up-down" class="w-4 h-4 text-blue-600"></i>
          <select id="selectTgSortOrder" onchange="renderTgLogs()" class="bg-transparent text-blue-900 text-xs font-bold focus:outline-none cursor-pointer">
            <option value="desc" class="bg-white text-slate-800">En Yeni</option>
            <option value="asc" class="bg-white text-slate-800">En Eski</option>
          </select>
        </div>
      </div>

      <!-- Log Listesi Container -->
      <div class="bg-white border-2 border-blue-100 rounded-3xl p-4 shadow-xl flex-1 flex flex-col">
        <div class="flex items-center justify-between mb-3 pb-2 border-b border-blue-50">
          <span class="text-[11px] font-extrabold text-blue-900 uppercase tracking-wider">Zaman Tüneli</span>
          <span id="txtTgLogCount" class="text-[10px] text-blue-800 font-bold bg-blue-50 px-2 py-0.5 rounded border border-blue-100">0 Kazanım</span>
        </div>

        <div id="tgLogsContainer" class="space-y-2 overflow-y-auto max-h-[380px] pr-1 custom-scrollbar flex-1">
          <div class="text-center py-8 text-slate-400 text-xs font-semibold">Loglar yükleniyor...</div>
        </div>
      </div>
    </div>

  </main>

  <script>
    // Yetkili Telegram ID'leri
    const ALLOWED_TELEGRAM_IDS = [6595229085]; 

    const SUPABASE_URL = 'https://kfrlpvjpivkiojsowbzw.supabase.co'; 
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtmcmxwdmpwaXZraW9qc293Ynp3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3ODc3NTAsImV4cCI6MjEwNzM2Mzc1MH0.UrycoXFp2oqRGhYZG1DbYv00qfIG8muFUNENMxjnFVM';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const tg = window.Telegram ? window.Telegram.WebApp : null;
    let inventory = [];
    let logsList = [];
    let activeTab = 'stock';

    function checkUserAuth() {
      if (tg) {
        tg.expand();
        tg.ready();
      }

      const currentUser = tg?.initDataUnsafe?.user;
      
      if (!currentUser || ALLOWED_TELEGRAM_IDS.includes(currentUser.id)) {
        document.getElementById('mainPanel').classList.remove('hidden');
        document.getElementById('mainPanel').classList.add('flex');
        if (currentUser) {
          document.getElementById('txtTgUser').textContent = `👤 ${currentUser.first_name}`;
        }
        return true;
      } else {
        document.getElementById('authErrorBox').classList.remove('hidden');
        return false;
      }
    }

    function switchTab(tab) {
      activeTab = tab;
      const stockBtn = document.getElementById('tabBtnStock');
      const logsBtn = document.getElementById('tabBtnLogs');
      const stockContent = document.getElementById('tabStockContent');
      const logsContent = document.getElementById('tabLogsContent');

      if (tab === 'stock') {
        stockBtn.className = "flex-1 py-2.5 rounded-xl text-xs font-extrabold bg-blue-600 text-white shadow-md transition-all flex items-center justify-center gap-1.5";
        logsBtn.className = "flex-1 py-2.5 rounded-xl text-xs font-extrabold text-slate-500 hover:text-blue-700 hover:bg-blue-50 transition-all flex items-center justify-center gap-1.5";
        stockContent.classList.remove('hidden');
        stockContent.classList.add('flex');
        logsContent.classList.add('hidden');
        logsContent.classList.remove('flex');
        document.getElementById('txtHeaderStats').textContent = `${inventory.length} Çeşit`;
      } else {
        logsBtn.className = "flex-1 py-2.5 rounded-xl text-xs font-extrabold bg-blue-600 text-white shadow-md transition-all flex items-center justify-center gap-1.5";
        stockBtn.className = "flex-1 py-2.5 rounded-xl text-xs font-extrabold text-slate-500 hover:text-blue-700 hover:bg-blue-50 transition-all flex items-center justify-center gap-1.5";
        logsContent.classList.remove('hidden');
        logsContent.classList.add('flex');
        stockContent.classList.add('hidden');
        stockContent.classList.remove('flex');
        loadTgLogs();
      }
      try { lucide.createIcons(); } catch(e) {}
    }

    // --- STOK METOTLARI ---
    async function loadTgData() {
      try {
        let { data, error } = await supabaseClient.from('inventory').select('*');
        if (error) throw error;
        inventory = data || [];
        renderTgInventory();
      } catch (e) {
        document.getElementById('txtSyncStatus').textContent = "Hata Oluştu";
        document.getElementById('txtSyncStatus').className = "text-[10px] text-red-600 font-bold bg-red-50 px-2 py-0.5 rounded border border-red-100";
      }
    }

    function renderTgInventory() {
      const container = document.getElementById('tgInventoryList');
      const query = document.getElementById('inputTgSearch').value.trim().toLowerCase();

      const filtered = inventory.map((item, originalIndex) => ({ item, originalIndex }))
        .filter(({ item }) => item.name.toLowerCase().includes(query));

      if (activeTab === 'stock') {
        document.getElementById('txtHeaderStats').textContent = `${inventory.length} Çeşit`;
      }

      if (filtered.length === 0) {
        container.innerHTML = `<div class="text-center py-8 text-slate-400 text-xs font-semibold">Ürün bulunamadı.</div>`;
        return;
      }

      container.innerHTML = filtered.map(({ item, originalIndex }) => `
        <div class="p-3 bg-blue-50/50 border border-blue-100 rounded-2xl flex items-center justify-between shadow-sm">
          <div class="flex-1 mr-2 truncate">
            <h4 class="text-xs font-bold text-blue-950 truncate">${item.name}</h4>
            <span class="text-[10px] text-slate-500 font-semibold">Stok: <span class="text-blue-700 font-extrabold">${item.qty} Adet</span></span>
          </div>
          <div class="flex items-center gap-1.5">
            <button onclick="changeQty(${originalIndex}, -1)" class="w-8 h-8 bg-white hover:bg-slate-50 border border-blue-200 text-blue-700 rounded-xl font-black text-lg flex items-center justify-center active:scale-90 transition-transform shadow-sm">-</button>
            <span class="w-8 text-center font-black text-blue-900 text-sm">${item.qty}</span>
            <button onclick="changeQty(${originalIndex}, 1)" class="w-8 h-8 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-black text-lg flex items-center justify-center active:scale-90 transition-transform shadow-sm">+</button>
          </div>
        </div>
      `).join('');

      try { lucide.createIcons(); } catch(e) {}
    }

    window.changeQty = async function(idx, delta) {
      const newQty = Math.max(0, (parseInt(inventory[idx].qty) || 0) + delta);
      inventory[idx].qty = newQty;
      inventory[idx].weight = Math.max(1, newQty);
      renderTgInventory();

      try {
        await supabaseClient.from('inventory').upsert([{
          id: inventory[idx].id,
          name: inventory[idx].name,
          qty: newQty,
          weight: Math.max(1, newQty)
        }]);
      } catch(e) {}
    };

    // --- LOG METOTLARI ---
    async function loadTgLogs() {
      try {
        let { data, error } = await supabaseClient
          .from('drawn_numbers')
          .select('*')
          .order('drawn_at', { ascending: false });

        if (error) throw error;
        logsList = data || [];
        populateTgDateOptions();
        renderTgLogs();
      } catch (e) {
        document.getElementById('tgLogsContainer').innerHTML = `<div class="text-center py-8 text-red-600 text-xs font-bold">Loglar yüklenemedi.</div>`;
      }
    }

    function populateTgDateOptions() {
      const select = document.getElementById('selectTgDateFilter');
      const currentValue = select.value;
      const uniqueDates = new Set();

      logsList.forEach(log => {
        if (log.drawn_at) {
          const d = new Date(log.drawn_at);
          if (!isNaN(d.getTime())) {
            uniqueDates.add(d.toISOString().split('T')[0]);
          }
        }
      });

      select.innerHTML = `<option value="all" class="bg-white text-slate-800">Tüm Günler</option>`;
      Array.from(uniqueDates).sort().reverse().forEach(dateStr => {
        const d = new Date(dateStr + 'T00:00:00');
        const formattedDate = d.toLocaleDateString('tr-TR', { day: 'numeric', month: 'short' });
        const opt = document.createElement('option');
        opt.value = dateStr;
        opt.className = 'bg-white text-slate-800 font-semibold';
        opt.textContent = formattedDate;
        select.appendChild(opt);
      });

      if (Array.from(select.options).some(o => o.value === currentValue)) {
        select.value = currentValue;
      }
    }

    function renderTgLogs() {
      const container = document.getElementById('tgLogsContainer');
      const dateFilter = document.getElementById('selectTgDateFilter').value;
      const sortOrder = document.getElementById('selectTgSortOrder').value;

      let filtered = logsList.filter(log => {
        if (dateFilter === 'all') return true;
        if (!log.drawn_at) return false;
        return new Date(log.drawn_at).toISOString().split('T')[0] === dateFilter;
      });

      document.getElementById('txtTgLogCount').textContent = `${filtered.length} Çekiliş`;
      if (activeTab === 'logs') {
        document.getElementById('txtHeaderStats').textContent = `Toplam: ${filtered.length}`;
      }

      filtered.sort((a, b) => {
        const timeA = new Date(a.drawn_at || 0).getTime();
        const timeB = new Date(b.drawn_at || 0).getTime();
        return sortOrder === 'desc' ? timeB - timeA : timeA - timeB;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div class="text-center py-8 text-slate-400 text-xs font-semibold">Bu tarihte çekiliş yok.</div>`;
        return;
      }

      let htmlContent = '';
      let lastDateStr = '';

      filtered.forEach((log, index) => {
        const dateObj = new Date(log.drawn_at);
        let dateStr = '';
        let displayDate = '';

        if (!isNaN(dateObj.getTime())) {
          dateStr = dateObj.toISOString().split('T')[0];
          displayDate = dateObj.toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' });
        }

        // Zaman Tüneli Çizgisi Ekleme Mantığı
        if (dateStr !== lastDateStr && dateStr) {
          if (index !== 0) htmlContent += `<div class="h-1"></div>`;
          htmlContent += `
            <div class="date-separator animate-fade-in">
              <div class="date-separator-line"></div>
              <div class="date-separator-text flex items-center gap-1">
                <i data-lucide="calendar" class="w-3 h-3"></i> ${displayDate}
              </div>
            </div>
          `;
          lastDateStr = dateStr;
        }

        const formattedNum = String(log.draw_number).padStart(3, '0');
        const hasValidDate = !isNaN(dateObj.getTime());
        const timeStr = hasValidDate ? dateObj.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' }) : 'Şimdi';

        htmlContent += `
          <div class="p-3 bg-blue-50/50 border border-blue-100 rounded-2xl flex items-center justify-between shadow-sm mb-1.5">
            <div class="flex items-center gap-2.5">
              <div class="w-10 h-10 rounded-xl bg-white border border-blue-200 flex items-center justify-center font-black text-blue-900 text-xs shadow-sm">
                ${formattedNum}
              </div>
              <div class="max-w-[140px] truncate">
                <p class="text-[9px] font-bold text-slate-500 uppercase tracking-wider mb-0.5">Kazanılan Hediye</p>
                <h4 class="text-xs font-extrabold text-blue-950 truncate">${log.prize_name}</h4>
              </div>
            </div>
            
            <div class="text-right flex flex-col items-end">
              <span class="text-[10px] bg-white text-slate-600 font-bold px-2 py-1 rounded-lg border border-blue-100 shadow-sm flex items-center gap-1">
                <i data-lucide="clock" class="w-3 h-3 text-blue-500"></i> ${timeStr}
              </span>
            </div>
          </div>
        `;
      });

      container.innerHTML = htmlContent;
      try { lucide.createIcons(); } catch(e) {}
    }

    // --- BUTON EVENTLERİ ---
    document.getElementById('btnTgShuffle').addEventListener('click', async () => {
      if (tg && tg.showConfirm) {
        tg.showConfirm("Çekiliş havuzu güncel stoklara göre yeniden karıştırılsın mı?", async (ok) => {
          if (ok) await shufflePool();
        });
      } else {
        await shufflePool();
      }
    });

    document.getElementById('btnTgReset').addEventListener('click', async () => {
      const confirmAction = () => {
        return new Promise((resolve) => {
          if (tg && tg.showConfirm) {
            tg.showConfirm("Çekilen tüm numaralar sıfırlansın mı?", (ok) => resolve(ok));
          } else {
            resolve(confirm("Çekilen tüm numaralar sıfırlansın mı?"));
          }
        });
      };

      const isConfirmed = await confirmAction();
      if (isConfirmed) {
        try {
          await supabaseClient.from('drawn_numbers').delete().neq('draw_number', 0);
          await shufflePool();
          if (tg) tg.showAlert("Çekiliş geçmişi ve havuz başarıyla sıfırlandı!");
          if (activeTab === 'logs') loadTgLogs();
        } catch (e) {}
      }
    });

    async function shufflePool() {
      let availableItems = inventory.filter(i => (parseInt(i.qty) || 0) > 0);
      let pool = [];
      availableItems.forEach(item => {
        const weight = Math.max(1, parseInt(item.qty) || 1);
        for (let w = 0; w < weight * 10; w++) pool.push(item.name);
      });

      let rows = [];
      for (let num = 1; num <= 1000; num++) {
        const randomIndex = Math.floor(Math.random() * pool.length);
        rows.push({ slot_number: num, prize_name: pool[randomIndex] || "Stok Bitti" });
      }

      await supabaseClient.from('slot_mapping').upsert(rows, { onConflict: 'slot_number' });
      if (tg) tg.showAlert("1000 slotluk havuz Telegram'dan başarıyla karıştırıldı!");
    }

    function setupRealtimeLogs() {
      supabaseClient
        .channel('public:drawn_numbers_tg')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'drawn_numbers' }, payload => {
          logsList.unshift(payload.new);
          populateTgDateOptions();
          if (activeTab === 'logs') renderTgLogs();
        })
        .subscribe();
    }

    window.onload = async function() {
      if (checkUserAuth()) {
        await loadTgData();
        setupRealtimeLogs();
      }
      try { lucide.createIcons(); } catch(e) {}
    };
  </script>
</body>
</html>
